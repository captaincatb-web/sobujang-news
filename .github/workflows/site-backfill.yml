name: Backfill Weekly News Pages

# site_request.txt 를 수정해 push하면 7월부터 지난 주차의 뉴스 페이지를 소급 생성해 site/news/ 에 커밋한다.
# 구글뉴스 날짜 범위 검색만 쓰므로 공시·주가는 빠진다. 배포는 pages.yml 이 site/ 변경을 올린다.
on:
  push:
    paths:
      - site_request.txt
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m src.site_backfill
      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A site data/site_weeks.json
          git commit -m "chore: backfill weekly news pages [$(head -1 site_request.txt)]" || exit 0
          git pull --rebase --autostash
          git push
