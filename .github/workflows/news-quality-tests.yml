name: News quality tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/news-quality-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "requests>=2.31" "feedparser>=6.0"
      - name: Compile source modules
        run: python -m compileall -q src tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_news_quality.py" -v
