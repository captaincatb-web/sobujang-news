name: Weekly News Page

# 매주 목요일 05:30(KST)에 이번 주 뉴스 페이지를 만들어 site/news/ 에 커밋한다 (기본 브랜치에서만 예약 실행).
# 이어서 pages.yml 의 매일 07:30 배포가 사이트에 올린다.
on:
  schedule:
    - cron: "30 20 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build this week (no email)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python -m src.newsletter --dry-run
      - name: Commit pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A site data
          git commit -m "chore: weekly news page $(date -u +%F)" || exit 0
          git pull --rebase --autostash
          git push
